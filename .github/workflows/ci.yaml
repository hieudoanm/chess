name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets

  cli-build:
    name: CLI - Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-quality` job.
    if: github.event_name != 'pull_request'
    needs: cli-quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Build release binary
        run: cargo build --release --locked -p chess-cli
      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/chess cli-chess-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/chess cli-chess-aarch64-apple-darwin ;;
            macos-15-intel) mv target/release/chess cli-chess-x86_64-apple-darwin ;;
            windows-latest) mv target/release/chess.exe cli-chess-x86_64-pc-windows-msvc.exe ;;
          esac
      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-chess-${{ matrix.os }}
          path: cli-chess-*
          if-no-files-found: error
          retention-days: 7

  desktop-quality:
    name: Desktop - Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: pnpm run typecheck

      - name: Lint desktop
        working-directory: packages/desktop
        run: pnpm run lint

      - name: Build desktop (Next.js static export)
        working-directory: packages/desktop
        run: pnpm run build

      - name: Test desktop
        working-directory: packages/desktop
        run: pnpm run test

      - name: Install Playwright browsers
        working-directory: packages/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop e2e
        working-directory: packages/desktop
        run: pnpm run test:e2e

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-e2e-desktop
          path: packages/desktop/playwright-report/
          if-no-files-found: ignore

  desktop-build:
    name: Desktop - Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release bundles are only needed for the master-branch release job;
    # PRs are covered by the `desktop-quality` job.
    if: github.event_name != 'pull_request'
    needs: desktop-quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-15-intel
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies and build outputs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libglib2.0-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev rpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS bundles
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles app,dmg

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        working-directory: packages/desktop/src-tauri/target/release/bundle/macos
        run: |
          shopt -s nullglob
          apps=(*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "expected exactly one .app bundle, found: ${apps[*]:-none}"
            ls -la
            exit 1
          fi
          zip -r "${apps[0]%.app}.app.zip" "${apps[0]}"

      # Both Mac legs produce identically named bundles; rename per-arch
      # before the artifacts merge in the release job.
      - name: Rename macOS bundles for release
        if: runner.os == 'macOS'
        working-directory: packages/desktop/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(uname -m)" = "arm64" ]; then
            triple=aarch64-apple-darwin
          else
            triple=x86_64-apple-darwin
          fi
          shopt -s nullglob
          for f in dmg/*.dmg; do mv "$f" "dmg/desktop-chess-${triple}.dmg"; done
          for f in macos/*.app.zip; do mv "$f" "macos/desktop-chess-${triple}.app.zip"; done

      - name: Build Linux bundles
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles deb,rpm,appimage

      - name: Rename Linux bundles for release
        if: runner.os == 'Linux'
        working-directory: packages/desktop/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in deb/*.deb; do mv "$f" "deb/desktop-chess-x86_64-unknown-linux-gnu.deb"; done
          for f in rpm/*.rpm; do mv "$f" "rpm/desktop-chess-x86_64-unknown-linux-gnu.rpm"; done
          for f in appimage/*.AppImage; do mv "$f" "appimage/desktop-chess-x86_64-unknown-linux-gnu.AppImage"; done

      - name: Build Windows bundles
        if: runner.os == 'Windows'
        working-directory: packages/desktop
        run: pnpm exec tauri build --bundles msi,nsis

      - name: Rename Windows bundles for release
        if: runner.os == 'Windows'
        working-directory: packages/desktop/src-tauri/target/release/bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in msi/*.msi; do mv "$f" "msi/desktop-chess-x86_64-pc-windows-msvc.msi"; done
          for f in nsis/*-setup.exe; do mv "$f" "nsis/desktop-chess-x86_64-pc-windows-msvc-setup.exe"; done

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chess-desktop-${{ matrix.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/macos/*.app.zip
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chess-desktop-${{ matrix.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chess-desktop-${{ matrix.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  browser-extension:
    name: Browser Extension - Quality & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        working-directory: packages/extensions/browser
        run: pnpm run typecheck

      - name: Lint extension
        working-directory: packages/extensions/browser
        run: pnpm run lint:check

      - name: Format check extension
        working-directory: packages/extensions/browser
        run: pnpm run format:check

      - name: Test extension
        working-directory: packages/extensions/browser
        run: pnpm run test

      - name: Package extension
        working-directory: packages/extensions/browser
        run: make package

      - name: Prefix artifact names
        run: |
          cd packages/extensions/browser/download
          for f in *; do mv "$f" "extension-browser-$f"; done

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-browser
          path: packages/extensions/browser/download/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs:
      - cli-build
      - desktop-build
      - browser-extension
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-chess-*
          path: dist
          merge-multiple: true

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: chess-desktop-*
          path: dist
          merge-multiple: true

      - name: Download extension artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: extension-browser
          path: dist
      - name: Flatten desktop bundles
        run: |
          find dist -type f -name 'desktop-chess-*' -exec mv {} dist/ \;
      - name: List release assets
        run: find dist -type f | sort
      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: Chess (latest)
          body_path: RELEASE.md
          files: dist/*

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.23.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
