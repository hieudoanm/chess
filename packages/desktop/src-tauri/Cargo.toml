[package]
name = "chess-desktop"
version = "0.0.1"
description = "Tournament Management"
authors = ["hieudoanm"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.8.0", features = [] }

[dependencies]
tauri = { version = "=2.13.0", features = [] }
tauri-plugin-shell = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
