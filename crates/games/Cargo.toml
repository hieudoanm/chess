[package]
name = "games"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "=0.13.5", features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"
tokio = { version = "=1.54.1", features = ["full"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
glob = "=0.3.4"
regex = "=1.13.1"

[[bin]]
name = "download-pgn"
path = "src/main.rs"

[[bin]]
name = "parse-pgn"
path = "src/bin/parse_pgn.rs"

[[bin]]
name = "fetch-titled"
path = "src/bin/fetch_titled.rs"

[[bin]]
name = "fetch-titled-details"
path = "src/bin/fetch_titled_details.rs"
