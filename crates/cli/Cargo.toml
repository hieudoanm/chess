[package]
name = "chess-cli"
description = "Command-line interface for the chess engine"
version = "0.1.0"
edition = "2021"

[dependencies]
chess-core = { path = "../core" }
chess-engine = { path = "../engine" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }

[[bin]]
name = "chess"
path = "src/main.rs"
