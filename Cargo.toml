[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/engine",
  "crates/cli",
  "crates/arena",
  "crates/games",
  "crates/nnue-train",
]
exclude = ["packages/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
