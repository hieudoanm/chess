<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CHESS — A chess engine in one Rust binary</title>
  <desc id="desc">CHESS. A chess engine in one Rust binary rust · uci · alpha-beta · mcp · cli.</desc>

  <defs>
    <pattern
